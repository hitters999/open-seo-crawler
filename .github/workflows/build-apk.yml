name: Build Android APK

on:
  push:
    branches: [master]
  workflow_dispatch:
    inputs:
      app_url:
        description: "Public URL of the running Open SEO Crawler web app"
        required: false
        type: string
        default: ""

permissions:
  contents: read

env:
  JAVA_VERSION: "17"
  # Set repository variable APP_URL for push builds, or provide app_url manually.
  DEFAULT_APP_URL: "http://10.0.2.2:5002/"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: yes | sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build debug APK
        working-directory: android
        env:
          INPUT_APP_URL: ${{ inputs.app_url }}
          REPOSITORY_APP_URL: ${{ vars.APP_URL }}
        run: |
          APP_URL="${INPUT_APP_URL:-${REPOSITORY_APP_URL:-${DEFAULT_APP_URL}}}"
          echo "Building APK configured for: ${APP_URL}"
          gradle --no-daemon --stacktrace assembleDebug -PappUrl="${APP_URL}"

      - name: Rename APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk open-seo-crawler-debug.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: open-seo-crawler-apk
          path: open-seo-crawler-debug.apk
          if-no-files-found: error
          retention-days: 14
