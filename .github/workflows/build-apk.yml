name: Build Android APK

on:
  push:
    branches: [master]
  workflow_dispatch:
    inputs:
      app_url:
        description: "Public URL of the running Open SEO Crawler web app"
        required: false
        type: string
        default: ""

permissions:
  contents: read

env:
  JAVA_VERSION: "17"
  # Set repository variable APP_URL for push builds, or provide app_url manually.
  # If empty, the APK shows a setup screen instead of opening an unreachable URL.
  DEFAULT_APP_URL: ""

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Configure Android SDK
        run: |
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          SDKMANAGER="$(command -v sdkmanager || find "$SDK_ROOT" -type f -name sdkmanager -print -quit)"
          test -n "$SDKMANAGER"
          echo "Using Android SDK: $SDK_ROOT"
          "$SDKMANAGER" --version
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          yes | "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build debug APK
        working-directory: android
        env:
          INPUT_APP_URL: ${{ inputs.app_url }}
          REPOSITORY_APP_URL: ${{ vars.APP_URL }}
        run: |
          APP_URL="${INPUT_APP_URL:-${REPOSITORY_APP_URL:-${DEFAULT_APP_URL}}}"
          echo "Building APK configured for: ${APP_URL}"
          gradle --no-daemon --stacktrace assembleDebug -PappUrl="${APP_URL}"

      - name: Rename APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk open-seo-crawler-debug.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: open-seo-crawler-apk
          path: open-seo-crawler-debug.apk
          if-no-files-found: error
          retention-days: 14
